name: Task
description: Internal engineering task or work item
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "## Task"

  - type: dropdown
    id: product
    attributes:
      label: Product / system
      options:
        - RailwayMitra
        - UBIS
        - RunwayMitra
        - Inspection Trolley
        - DAQ Pipeline
        - Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      placeholder: What needs to be done and why?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] 
        - [ ]
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Linked milestone or sprint
      placeholder: "e.g. UBIS Phase 0 Gate UB15, Q1 FY26-27"

  - type: input
    id: owner
    attributes:
      label: Assignee / owner